[project]
name = "formula-lab"
version = "0.1.0"
description = "Painel local para treinar e conversar com Qwen sobre fórmulas de Excel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "datasets==5.0.1",
    "psutil==7.2.2",
    "peft==0.21.0",
    "openpyxl==3.1.5",
    "pywin32==312; sys_platform == 'win32'",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
